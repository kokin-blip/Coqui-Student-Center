name: Desktop CI
on:
  push:
  pull_request:
  workflow_dispatch:

# A superseded run is wasted spend on a private repo, where macOS bills at a
# 10x minute multiplier and Windows at 2x.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      # Deliberately not `--workspaces`: apps/desktop's `check` is a cargo check,
      # and Tauri cannot configure on Linux without the GTK/glib stack. The app
      # ships nsis and dmg only, and the desktop job below compiles and tests the
      # Rust on both shipping targets, so a Linux cargo check buys no coverage in
      # exchange for an apt install of a toolchain we never release against.
      - run: npm run check --workspace @student-center/desktop-ui --workspace @student-center/contracts --workspace @student-center/cloud-api --if-present
      - run: npm run test --workspaces --if-present
      - run: npm run test:ocr
      - run: npm run ocr:verify -- --target=windows-x64
      - run: npm run ocr:verify -- --target=macos-arm64
      # The course catalog is regenerated by hand from class-search exports, so a
      # bad run yields plausible JSON rather than an error. Pure data validation,
      # so it belongs here rather than on the platform legs.
      - run: npm run catalog:verify
      - run: npm run calendar:verify

  # Two from-source Tesseract builds plus two native packaging runs. Restricted
  # to pull requests, the default branch, and manual dispatch: running this on
  # every push to every branch is what exhausted the Actions quota.
  desktop:
    needs: contracts
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
            ocr_target: windows-x64
            vcpkg_triplet: x64-windows-static
            rust_target: ""
            e2e_args: ""
            e2e_binary: apps/desktop/src-tauri/target/release/student-center.exe
          - platform: macos-15
            args: --target aarch64-apple-darwin --bundles dmg
            ocr_target: macos-arm64
            vcpkg_triplet: arm64-osx-static
            rust_target: aarch64-apple-darwin
            e2e_args: --target aarch64-apple-darwin
            e2e_binary: apps/desktop/src-tauri/target/aarch64-apple-darwin/release/student-center
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/student-center-vcpkg-cache
          key: ocr-vcpkg-${{ matrix.platform }}-${{ matrix.vcpkg_triplet }}-aae277acf4e7
      - name: Build pinned static Tesseract runtime
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/student-center-vcpkg-cache
        run: node scripts/build-tesseract-vcpkg.mjs --root=${{ runner.temp }}/student-center-vcpkg --triplet=${{ matrix.vcpkg_triplet }}
      - name: Prepare verified OCR resources
        run: npm run ocr:prepare -- --target=${{ matrix.ocr_target }} --tesseract-root=${{ runner.temp }}/student-center-vcpkg/installed/${{ matrix.vcpkg_triplet }}
      - name: Enforce OCR release gate
        run: npm run ocr:verify -- --target=${{ matrix.ocr_target }} --require-ready
      # Absolute: cargo runs the test binary with its working directory set to
      # the package root, so a repo-relative runtime path resolves to nothing
      # and PDFium fails to load.
      - name: Test native app with prepared OCR runtime
        env:
          STUDENT_CENTER_OCR_RUNTIME: ${{ github.workspace }}/apps/desktop/src-tauri/resources/ocr/${{ matrix.ocr_target }}
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build test-only embedded WebDriver binary
        env:
          VITE_WDIO: "true"
        run: npm run desktop:build -- --config apps/desktop/src-tauri/tauri.wdio.conf.json --features wdio --no-bundle ${{ matrix.e2e_args }}
      - name: Smoke native IPC and honest first run
        env:
          STUDENT_CENTER_E2E_BINARY: ${{ matrix.e2e_binary }}
        run: npm run test:desktop:e2e
      - run: npm run desktop:build -- ${{ matrix.args }}
      # 0.9.0 shipped a DMG whose .app had no _CodeSignature seal, which macOS
      # reports as "damaged and cannot be opened". Catching that here, on the
      # pull request, is the whole point: the release lane finds it too, but only
      # after the tag is already public.
      - name: Enforce macOS signature gate
        if: matrix.platform == 'macos-15'
        run: npm run macos:verify-signature -- --target=${{ matrix.rust_target }}
      - run: npm run release:checksums
      - name: Smoke installed Windows package
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # Never run this against a developer account: the hosted runner is the
          # isolation boundary for both the local database and credential vault.
          if ($env:RUNNER_ENVIRONMENT -ne "github-hosted") { throw "Installer smoke requires a disposable hosted account." }
          $profileRoot = Join-Path $env:APPDATA "app.studentcenter.desktop"
          if (Test-Path $profileRoot) { throw "Refusing to touch an existing Coqui profile." }
          $installer = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $installRoot = Join-Path $env:RUNNER_TEMP "CoquiSmoke"
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installRoot" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS installation failed." }
          $apps = @(Get-ChildItem $installRoot -Filter "*.exe" | Where-Object { $_.Name -notlike "uninstall*" })
          if ($apps.Count -ne 1) { throw "The NSIS installer did not create exactly one application executable." }
          $database = Join-Path $profileRoot "student-center.db"
          foreach ($launch in 1..2) {
            $process = Start-Process -FilePath $apps[0].FullName -PassThru
            try {
              Start-Sleep -Seconds 8
              if ($process.HasExited) { throw "The installed application exited on launch $launch." }
              if (-not (Test-Path $database)) { throw "The installed application did not persist its profile." }
            } finally {
              if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force; $process.WaitForExit() }
            }
          }
          $uninstaller = Get-ChildItem $installRoot -Filter "uninstall*.exe" | Select-Object -First 1
          if (-not $uninstaller) { throw "The NSIS installer did not create an uninstaller." }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "NSIS uninstallation failed." }
          Start-Sleep -Seconds 3
          if (Test-Path $apps[0].FullName) { throw "The application executable survived uninstallation." }
      - name: Smoke installed macOS package
        if: matrix.platform == 'macos-15'
        shell: bash
        run: |
          set -euo pipefail
          # The disposable hosted account also isolates the macOS credential vault.
          test "$RUNNER_ENVIRONMENT" = github-hosted
          profile_root="$HOME/Library/Application Support/app.studentcenter.desktop"
          test ! -e "$profile_root"
          dmg=$(find apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          mount_point="$RUNNER_TEMP/coqui-dmg"
          copy_root="$RUNNER_TEMP/coqui-app"
          mkdir -p "$mount_point" "$copy_root"
          hdiutil attach "$dmg" -nobrowse -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point" -force || true' EXIT
          cp -R "$mount_point/Coqui Student Center.app" "$copy_root/"
          codesign --verify --deep --strict "$copy_root/Coqui Student Center.app"
          binary="$copy_root/Coqui Student Center.app/Contents/MacOS/student-center"
          for launch in 1 2; do
            "$binary" &
            app_pid=$!
            sleep 8
            kill -0 "$app_pid"
            test -s "$profile_root/student-center.db"
            kill "$app_pid"
            wait "$app_pid" || true
          done
          hdiutil detach "$mount_point"
          trap - EXIT
      - uses: actions/upload-artifact@v4
        with:
          name: student-center-${{ matrix.platform }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/nsis/*.sha256
            apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.sha256
            apps/desktop/src-tauri/resources/ocr/${{ matrix.ocr_target }}/runtime-lock.json
            apps/desktop/src-tauri/resources/ocr/${{ matrix.ocr_target }}/THIRD_PARTY_NOTICES.txt
