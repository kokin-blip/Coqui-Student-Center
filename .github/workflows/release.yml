name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build, for example v0.12.0"
        required: true
      release_mode:
        description: "Unsigned prerelease or future signed updater release"
        type: choice
        required: true
        default: unsigned
        options:
          - unsigned
          - signed-updater

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-packages:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: windows-x64
            args: --bundles nsis
            ocr_target: windows-x64
            vcpkg_triplet: x64-windows-static
            rust_target: ""
            packages: |
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
              apps/desktop/src-tauri/target/release/bundle/nsis/*.sha256
            updater_artifacts: |
              apps/desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip
              apps/desktop/src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
          - platform: macos-15
            label: macos-arm64
            args: --target aarch64-apple-darwin --bundles dmg
            ocr_target: macos-arm64
            vcpkg_triplet: arm64-osx-static
            rust_target: aarch64-apple-darwin
            packages: |
              apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.sha256
            updater_artifacts: |
              apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
              apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
              apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.sha256
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/student-center-vcpkg-cache
          key: ocr-vcpkg-${{ matrix.platform }}-${{ matrix.vcpkg_triplet }}-aae277acf4e7
      - name: Build pinned static Tesseract runtime
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/student-center-vcpkg-cache
        run: node scripts/build-tesseract-vcpkg.mjs --root=${{ runner.temp }}/student-center-vcpkg --triplet=${{ matrix.vcpkg_triplet }}
      - name: Prepare verified OCR resources
        run: npm run ocr:prepare -- --target=${{ matrix.ocr_target }} --tesseract-root=${{ runner.temp }}/student-center-vcpkg/installed/${{ matrix.vcpkg_triplet }}
      - name: Enforce OCR release gate
        run: npm run ocr:verify -- --target=${{ matrix.ocr_target }} --require-ready
      - run: npm run catalog:verify
      - run: npm run calendar:verify
      - name: Test native app with prepared OCR runtime
        env:
          STUDENT_CENTER_OCR_RUNTIME: ${{ github.workspace }}/apps/desktop/src-tauri/resources/ocr/${{ matrix.ocr_target }}
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Require signed updater configuration
        if: (inputs.release_mode || 'unsigned') == 'signed-updater'
        env:
          STUDENT_CENTER_UPDATER_ENDPOINT: ${{ secrets.STUDENT_CENTER_UPDATER_ENDPOINT }}
          STUDENT_CENTER_UPDATER_PUBLIC_KEY: ${{ secrets.STUDENT_CENTER_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run release:validate-updater
      - name: Build unsigned installers
        if: (inputs.release_mode || 'unsigned') == 'unsigned'
        run: npm run desktop:build -- ${{ matrix.args }}
      - name: Build installers and signed updater artifacts
        if: (inputs.release_mode || 'unsigned') == 'signed-updater'
        env:
          STUDENT_CENTER_UPDATER_ENDPOINT: ${{ secrets.STUDENT_CENTER_UPDATER_ENDPOINT }}
          STUDENT_CENTER_UPDATER_PUBLIC_KEY: ${{ secrets.STUDENT_CENTER_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build -- --config apps/desktop/src-tauri/tauri.release.conf.json ${{ matrix.args }}
      - name: Verify macOS ad-hoc bundle seal
        if: matrix.platform == 'macos-15'
        run: npm run macos:verify-signature -- --target=${{ matrix.rust_target }}
      - run: npm run release:checksums
      - name: Smoke Windows installer
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # A fresh hosted OS account isolates both the profile and credential vault.
          if ($env:RUNNER_ENVIRONMENT -ne "github-hosted") { throw "Installer smoke requires a disposable hosted account." }
          $profileRoot = Join-Path $env:APPDATA "app.studentcenter.desktop"
          if (Test-Path $profileRoot) { throw "Refusing to touch an existing Coqui profile." }
          $installer = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $installRoot = Join-Path $env:RUNNER_TEMP "CoquiSmoke"
          $install = Start-Process -FilePath $installer.FullName -ArgumentList "/S", "/D=$installRoot" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "NSIS installation failed." }
          $apps = @(Get-ChildItem $installRoot -Filter "*.exe" | Where-Object { $_.Name -notlike "uninstall*" })
          if ($apps.Count -ne 1) { throw "The NSIS installer did not create exactly one application executable." }
          $database = Join-Path $profileRoot "student-center.db"
          foreach ($launch in 1..2) {
            $process = Start-Process -FilePath $apps[0].FullName -PassThru
            try {
              Start-Sleep -Seconds 8
              if ($process.HasExited) { throw "The installed application exited on launch $launch." }
              if (-not (Test-Path $database)) { throw "The installed application did not persist its profile." }
            } finally {
              if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force; $process.WaitForExit() }
            }
          }
          $uninstaller = Get-ChildItem $installRoot -Filter "uninstall*.exe" | Select-Object -First 1
          if (-not $uninstaller) { throw "The NSIS installer did not create an uninstaller." }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList "/S" -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "NSIS uninstallation failed." }
          Start-Sleep -Seconds 3
          if (Test-Path $apps[0].FullName) { throw "The application executable survived uninstallation." }
      - name: Smoke mounted macOS package
        if: matrix.platform == 'macos-15'
        shell: bash
        run: |
          set -euo pipefail
          # The disposable hosted account also isolates the macOS credential vault.
          test "$RUNNER_ENVIRONMENT" = github-hosted
          profile_root="$HOME/Library/Application Support/app.studentcenter.desktop"
          test ! -e "$profile_root"
          dmg=$(find apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          mount_point="$RUNNER_TEMP/coqui-dmg"
          copy_root="$RUNNER_TEMP/coqui-app"
          mkdir -p "$mount_point" "$copy_root"
          hdiutil attach "$dmg" -nobrowse -mountpoint "$mount_point"
          trap 'hdiutil detach "$mount_point" -force || true' EXIT
          cp -R "$mount_point/Coqui Student Center.app" "$copy_root/"
          codesign --verify --deep --strict "$copy_root/Coqui Student Center.app"
          binary="$copy_root/Coqui Student Center.app/Contents/MacOS/student-center"
          for launch in 1 2; do
            "$binary" &
            app_pid=$!
            sleep 8
            kill -0 "$app_pid"
            test -s "$profile_root/student-center.db"
            kill "$app_pid"
            wait "$app_pid" || true
          done
          hdiutil detach "$mount_point"
          trap - EXIT
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.label }}
          path: ${{ matrix.packages }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: (inputs.release_mode || 'unsigned') == 'signed-updater'
        with:
          name: updater-${{ matrix.label }}
          path: ${{ matrix.updater_artifacts }}
          if-no-files-found: error

  publish-unsigned:
    needs: build-packages
    if: (inputs.release_mode || 'unsigned') == 'unsigned'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: true
          body_path: docs/releases/0.12.0.md
          fail_on_unmatched_files: true
          files: release-artifacts/*

  updater-manifest:
    needs: build-packages
    if: (inputs.release_mode || 'unsigned') == 'signed-updater'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: updater-artifacts
          merge-multiple: true
      - run: >-
          npm run release:create-updater-manifest --
          --artifacts=updater-artifacts
          --repository=${{ github.repository }}
          --tag=${{ inputs.tag || github.ref_name }}
          --output=latest.json
      - uses: actions/upload-artifact@v4
        with:
          name: updater-manifest
          path: |
            latest.json
            latest.json.sha256

  publish-signed:
    needs: updater-manifest
    if: (inputs.release_mode || 'unsigned') == 'signed-updater'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-artifacts
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: updater-*
          path: release-artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: true
          body_path: docs/releases/0.12.0.md
          fail_on_unmatched_files: true
          files: release-artifacts/*
