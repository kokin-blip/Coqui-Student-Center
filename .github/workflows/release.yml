name: Release

# Publishing is driven by the tag, not by a branch, so the default branch name
# is irrelevant here. workflow_dispatch exists to re-run a lane that failed
# after the tag was already pushed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach artifacts to, e.g. v0.9.0"
        required: true

# Without this the whole matrix builds successfully and then 403s on the very
# last step, throwing away two native builds.
permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Deliberately mirrors the `desktop` job in ci.yml: the vcpkg -> Tesseract ->
  # ocr:prepare -> ocr:verify chain is the mandatory pre-packaging gate, not
  # optional setup. The e2e smoke is not repeated here; ci.yml already runs it
  # against the same commit.
  release:
    strategy:
      # One platform failing must not cancel the other. A half-published
      # prerelease is recoverable by re-dispatching the failed lane; a
      # cancelled one wastes both builds.
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: --bundles nsis
            ocr_target: windows-x64
            vcpkg_triplet: x64-windows-static
            rust_target: ""
            # Per-platform, because fail_on_unmatched_files below treats a glob
            # that matches nothing as an error. Listing both platforms' globs
            # on both legs would fail every run.
            artifacts: |
              apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
              apps/desktop/src-tauri/target/release/bundle/nsis/*.sha256
          - platform: macos-15
            args: --target aarch64-apple-darwin --bundles dmg
            ocr_target: macos-arm64
            vcpkg_triplet: arm64-osx-static
            rust_target: aarch64-apple-darwin
            artifacts: |
              apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
              apps/desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.sha256
    runs-on: ${{ matrix.platform }}
    steps:
      # On a tag push ref_name is the tag; on a dispatch it is the branch, so
      # the tag has to be named explicitly or a re-run would build the wrong
      # commit and have no release to attach to.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
      - run: npm ci
      # Same cache key as ci.yml so a release reuses the Tesseract build CI
      # already paid for. Keep the two keys in sync when the pin moves.
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/student-center-vcpkg-cache
          key: ocr-vcpkg-${{ matrix.platform }}-${{ matrix.vcpkg_triplet }}-aae277acf4e7
      - name: Build pinned static Tesseract runtime
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/student-center-vcpkg-cache
        run: node scripts/build-tesseract-vcpkg.mjs --root=${{ runner.temp }}/student-center-vcpkg --triplet=${{ matrix.vcpkg_triplet }}
      - name: Prepare verified OCR resources
        run: npm run ocr:prepare -- --target=${{ matrix.ocr_target }} --tesseract-root=${{ runner.temp }}/student-center-vcpkg/installed/${{ matrix.vcpkg_triplet }}
      - name: Enforce OCR release gate
        run: npm run ocr:verify -- --target=${{ matrix.ocr_target }} --require-ready
      - name: Test native app with prepared OCR runtime
        env:
          STUDENT_CENTER_OCR_RUNTIME: ${{ github.workspace }}/apps/desktop/src-tauri/resources/ocr/${{ matrix.ocr_target }}
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      # No tauri.release.conf.json overlay: it sets createUpdaterArtifacts, which
      # fails the build outright unless TAURI_SIGNING_PRIVATE_KEY is present.
      # This is an unsigned private-beta build, so updater artifacts are out.
      - run: npm run desktop:build -- ${{ matrix.args }}
      - run: npm run release:checksums
      # fail_on_unmatched_files matters: without it a bundle that quietly did
      # not build yields a Release that is missing assets but reports success.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          prerelease: true
          fail_on_unmatched_files: true
          files: ${{ matrix.artifacts }}
