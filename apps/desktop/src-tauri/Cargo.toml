[package]
name = "student-center"
version = "0.8.0"
description = "Local-first Student Center desktop application"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
age = "0.12.1"
argon2 = "0.5"
base64 = "0.22"
bip39 = "2.2"
calamine = { version = "0.36", features = ["chrono"] }
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
csv = "1.3"
hex = "0.4"
iana-time-zone = "0.1"
ical = "0.11"
infer = "0.22"
keyring = { version = "3", features = ["apple-native", "windows-native"] }
libloading = "0.8"
pdf-extract = "0.12"
png = "0.18.1"
quick-xml = "0.38"
rand = "0.8"
regex = "1.11"
ring = "0.17"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
rrule = "0.14"
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"
tauri-plugin-wdio = { version = "1", optional = true }
tauri-plugin-wdio-webdriver = { version = "1", optional = true }
tar = "0.4.46"
thiserror = "2"
tempfile = "3"
uuid = { version = "1.11", features = ["v4", "serde"] }
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
url = "2"
wait-timeout = "0.2"
zip = "2.2"
zeroize = { version = "1.8", features = ["alloc"] }

# DPAPI, used only by device_key::platform, which is #[cfg(target_os = "windows")].
# This has to stay target-scoped: as a plain dependency it pulls windows-future
# into the macOS graph, and that crate cannot compile off Windows because the
# windows-core items it calls (imp::marshaler, imp::IMarshal) are cfg(windows).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
wdio = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]
