<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scholarship form polish comparison</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 28px;
        color: #edf3ef;
        background: #0d100f;
        font: 14px/1.45 Inter, system-ui, sans-serif;
      }
      main {
        display: grid;
        grid-template-columns: minmax(320px, 553px) minmax(440px, 766px);
        gap: 24px;
        align-items: start;
        justify-content: center;
      }
      figure { margin: 0; }
      figcaption { margin-bottom: 10px; font-weight: 700; }
      img {
        display: block;
        width: 100%;
        height: auto;
        border: 1px solid #2d3632;
      }
    </style>
  </head>
  <body>
    <main>
      <figure>
        <figcaption>Before · supplied screenshot</figcaption>
        <img src="07-scholarship-form-before.png" alt="Scholarship form before polish" />
      </figure>
      <figure>
        <figcaption>After · Compact dark implementation</figcaption>
        <img src="08-scholarship-form-polished-crop.png" alt="Scholarship form after polish" />
      </figure>
    </main>
  </body>
</html>
